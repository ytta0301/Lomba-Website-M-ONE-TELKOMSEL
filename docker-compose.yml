services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodingkids-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: kodingkids
      DB_PASS: kodingkids123
      DB_NAME: kodingkids
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: kodingkids-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kodingkids
      MYSQL_USER: kodingkids
      MYSQL_PASSWORD: kodingkids123
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u kodingkids -pkodingkids123 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
